<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0a7332"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="icon" href="icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="e-Logbook KAKV"><meta name="description" content="e-Logbook Subspesialis Anestesi Kardiovaskuler FK Unpad"></head><body><title>e-Logbook Subspesialis Anestesi Kardiovaskuler</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: one-column phone app — header pita hijau FK (emas Unpad di tepi bawah), view bergulir, tab bar dengan tombol "Catat" emas.
   Warna: Kuning Unpad #FDB913 (warna utama), Merah Unpad #ED1C24 (sekunder), Hijau Fakultas Kedokteran (CMYK 100/0/100/60 ≈ #006600) dicerahkan.
   Kategori kompetensi dikodekan dengan warna kanal monitor anestesi (EKG, ABP, SpO2, CVP, EtCO2 …). */
:root{
  --bg:#f3f8f1; --surface:#ffffff; --surface2:#eef5eb; --ink:#132014; --muted:#56685a; --line:#d5e2d1;
  --accent:#0b7a35; --accent-ink:#ffffff; --accent-soft:#dcf0e1;
  --gold:#fdb913; --gold-ink:#1a1a1a; --gold-soft:#fff4d6;
  --hdr1:#0a7332; --hdr2:#15984b; --hdr-ink:#ffffff; --hdr-sub:#ffe7a3; --hdr-muted:rgba(255,255,255,.84);
  --ok:#1d8a4c; --warn:#b26a00; --bad:#c8141b;
  --c1:#1f9d55; --c2:#e2232b; --c3:#0a9fbd; --c4:#3a68d1; --c5:#b89100; --c6:#c2417e; --c7:#7a52c7; --c8:#d2691e; --c9:#4f7f2a;
  --f-display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09130b; --surface:#112015; --surface2:#0c1910; --ink:#e4efe5; --muted:#93a896; --line:#213326;
  --accent:#43c773; --accent-ink:#06210f; --accent-soft:#143524;
  --gold:#fdb913; --gold-ink:#1a1a1a; --gold-soft:#2e2610;
  --hdr1:#0a5a29; --hdr2:#0e7637; --hdr-ink:#ffffff; --hdr-sub:#ffe7a3; --hdr-muted:rgba(255,255,255,.8);
  --ok:#4cc782; --warn:#e2b23a; --bad:#ff6b6b;
  --c1:#3ddc84; --c2:#ff5c5c; --c3:#2fd3f0; --c4:#6f98ff; --c5:#f2cf36; --c6:#ff6fb0; --c7:#a989ff; --c8:#ff9a4d; --c9:#9ad65a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09130b; --surface:#112015; --surface2:#0c1910; --ink:#e4efe5; --muted:#93a896; --line:#213326;
  --accent:#43c773; --accent-ink:#06210f; --accent-soft:#143524;
  --gold:#fdb913; --gold-ink:#1a1a1a; --gold-soft:#2e2610;
  --hdr1:#0a5a29; --hdr2:#0e7637; --hdr-ink:#ffffff; --hdr-sub:#ffe7a3; --hdr-muted:rgba(255,255,255,.8);
  --ok:#4cc782; --warn:#e2b23a; --bad:#ff6b6b;
  --c1:#3ddc84; --c2:#ff5c5c; --c3:#2fd3f0; --c4:#6f98ff; --c5:#f2cf36; --c6:#ff6fb0; --c7:#a989ff; --c8:#ff9a4d; --c9:#9ad65a;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:96px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:24px;height:24px}
.brand{min-width:0;flex:1}
.brand b{font-family:var(--f-display);font-size:14.5px;line-height:1.2;letter-spacing:.005em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:10px;white-space:nowrap;letter-spacing:.09em;color:var(--accent);font-weight:700}
.logo.img{width:40px;height:auto;background:transparent;border-radius:0}
.logo.img img{width:100%;height:auto;display:block}
.brand span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h2{font-size:20px}
h3{font-size:15px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
section.view{display:flex;flex-direction:column;gap:18px;padding-block:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{background:transparent;border-color:transparent;padding:8px 10px}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* summary */
.summary{border-top:4px solid var(--gold);display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:16px}
.ring{width:108px;height:108px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .val b{font-family:var(--f-display);font-size:26px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;min-width:0}
.stat b{font-family:var(--f-display);font-size:20px;display:block}
.stat span{font-size:12px;color:var(--muted)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:13px}

/* category tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);position:relative;overflow:hidden}
.tile .k{display:flex;align-items:center;gap:7px;font-family:var(--f-display);font-weight:700;font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--cc);flex:none}
.tile .desc{font-size:12px;color:var(--muted);line-height:1.3;min-height:31px}
.tile .num{font-family:var(--f-mono);font-size:13px}
.bar{height:6px;border-radius:3px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--cc);border-radius:3px}
.tile.done::after{content:"Target tercapai";position:absolute;top:10px;right:10px;font-size:10px;font-weight:700;color:var(--ok);letter-spacing:.03em}

/* list */
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.daygroup{display:flex;flex-direction:column;gap:8px}
.entry{display:grid;grid-template-columns:4px 1fr auto;gap:12px;padding:12px 12px 12px 0;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.entry .stripe{background:var(--cc);border-radius:0 3px 3px 0}
.entry .main{min-width:0;display:flex;flex-direction:column;gap:3px}
.entry .t1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.entry .t1 b{font-weight:700}
.entry .dx{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:color-mix(in srgb,var(--cc) 16%,transparent);color:var(--ink);letter-spacing:.02em;white-space:nowrap}
.tag.lv{--cc:var(--accent)}
.tag.ex{--cc:var(--warn)}
.icons{display:flex;gap:8px;color:var(--muted);align-items:center}
.icons span{display:inline-flex;gap:3px;align-items:center}
.icons svg{width:14px;height:14px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* form */
form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:76px;resize:vertical}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-height:44px;display:block;min-width:0;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left}
select{-webkit-appearance:none;appearance:none;min-height:44px;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;text-overflow:ellipsis}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1.2fr .8fr 1fr;gap:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:transparent;padding:10px 6px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.katpick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.katpick button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 4px;font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:6px}
.katpick button[aria-pressed="true"]{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,var(--surface));box-shadow:inset 0 0 0 1px var(--cc)}
.fieldset{display:flex;flex-direction:column;gap:12px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface2)}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.levels button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;line-height:1.2;text-align:center}
.levels button b{font-family:var(--f-display);font-size:18px}
.levels button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.skills{display:flex;flex-wrap:wrap;gap:6px}
.skills .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.drop .row .btn{flex:1}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);font-size:13px}
.file .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file svg{width:18px;height:18px;flex:none;color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface2);max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1;display:grid;place-items:center}
.req{color:var(--bad)}
.err{color:var(--bad);font-size:13px}
.formbar{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.formbar .btn{flex:1}

/* detail */
.dl{display:grid;grid-template-columns:minmax(0,38%) 1fr;gap:0;border-top:1px solid var(--line)}
.dl dt,.dl dd{margin:0;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;min-width:0;overflow-wrap:anywhere}
.dl dt{color:var(--muted);font-size:12.5px;font-weight:600}
.dhead{padding:16px;display:flex;flex-direction:column;gap:8px}
.confirm{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:10px;border:1px solid color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 7%,var(--surface))}

/* more */
.list{display:flex;flex-direction:column}
.list .it{display:flex;gap:12px;align-items:center;padding:14px;border-bottom:1px solid var(--line);text-align:left;background:transparent;border-left:0;border-right:0;border-top:0;width:100%}
.list .it:last-child{border-bottom:0}
.list .it svg{width:22px;height:22px;color:var(--accent);flex:none}
.list .it div{flex:1;min-width:0}
.list .it b{display:block;font-weight:600}
.list .it small{color:var(--muted);font-size:12.5px}
.note{font-size:13px;color:var(--muted);padding:12px 14px;border-left:3px solid var(--warn);background:var(--surface);border-radius:0 10px 10px 0}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px}
.switch input{width:44px;height:24px;flex:none;accent-color:var(--accent)}

/* tabbar */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1.1fr 1fr 1fr;align-items:end;height:68px}
nav.tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:8px 0 10px}
nav.tabbar button svg{width:22px;height:22px}
nav.tabbar button[aria-current="page"]{color:var(--accent)}
nav.tabbar .fab{align-self:center}
nav.tabbar .fab span.b{width:54px;height:54px;border-radius:16px;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;box-shadow:0 6px 18px color-mix(in srgb,var(--gold) 45%,transparent);margin-top:-22px;border:3px solid var(--surface)}
nav.tabbar .fab span.b svg{width:26px;height:26px}

/* login */
.locked .app,.locked nav.tabbar{display:none!important}
#login{min-height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:22px;padding-block:28px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
#login .lhead{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
#login .lhead img{width:88px;height:auto}
#login .lhead .mark{width:64px;height:64px;border-radius:18px;background:var(--accent);display:grid;place-items:center}
#login .lhead .mark svg{width:40px;height:40px}
#login .lhead small{font-size:11px;letter-spacing:.1em;color:var(--accent);font-weight:700}
#login{background:linear-gradient(180deg,var(--accent-soft),var(--bg) 45%)}
#login .lcard{border-top:4px solid var(--gold)}
#login .lhead h1{font-size:22px;line-height:1.2}
#login .lcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px}
.gbtn svg{width:20px;height:20px;flex:none}
.gbtn:disabled{opacity:.6;cursor:default}
.who-acct{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;display:grid;place-items:center;overflow:hidden;padding:0;font-family:var(--f-display)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.brand{flex:1 0 auto;max-width:calc(100% - 96px)}
.brand #who{color:var(--muted);font-size:11px;white-space:nowrap}
.acct{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:4px 2px 4px 6px;border-radius:999px;margin-left:auto;flex:0 1 auto;min-width:0}
.acct:hover{background:var(--surface2)}
.acct-name{font-size:11.5px;max-width:110px;font-weight:600;line-height:1.25;text-align:right;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;min-width:0}
@media (max-width:370px){.acct-name{display:none}}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
/* tempel whatsapp */
.wa-panel{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid color-mix(in srgb,var(--c1) 45%,var(--line));border-radius:var(--r);background:color-mix(in srgb,var(--c1) 7%,var(--surface))}
.wa-panel textarea{min-height:130px;font-size:13.5px}
.wa-open{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-radius:var(--r);border:1px dashed color-mix(in srgb,var(--c1) 60%,var(--line));background:var(--surface);text-align:left}
.wa-open svg{width:22px;height:22px;color:var(--c1);flex:none}
.wa-open b{display:block}
.wa-list{display:flex;flex-direction:column;gap:6px}
.wa-item{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13px}
.wa-item div{flex:1;min-width:0}
.wa-item b{display:block}
.wa-item.done{opacity:.55}
.wa-bar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--c1) 12%,var(--surface));font-size:13px}
input.auto,textarea.auto,select.auto{border-color:color-mix(in srgb,var(--warn) 70%,var(--line));background:color-mix(in srgb,var(--warn) 7%,var(--surface))}
/* kegiatan ilmiah */
.act{display:grid;grid-template-columns:54px 1fr auto;gap:12px;padding:12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);align-items:start}
.datebox{border:1px solid var(--line);border-radius:10px;overflow:hidden;text-align:center;background:var(--surface2)}
.datebox b{display:block;font-family:var(--f-display);font-size:20px;line-height:1.1;padding-top:5px}
.datebox span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-bottom:5px}
.act .main{min-width:0;display:flex;flex-direction:column;gap:4px}
.act .ttl{font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.act .meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12.5px;color:var(--muted);align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.pill.zoom{border-color:color-mix(in srgb,var(--c4) 50%,var(--line));background:color-mix(in srgb,var(--c4) 12%,transparent)}
.pill.off{border-color:color-mix(in srgb,var(--c1) 50%,var(--line));background:color-mix(in srgb,var(--c1) 12%,transparent)}
.pill svg{width:12px;height:12px}
.semcount{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.semcount div{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:center}
.semcount b{font-family:var(--f-display);font-size:20px;display:block}
.semcount span{font-size:11.5px;color:var(--muted)}
.linkbox{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);font-size:13px}
.linkbox .nm{flex:1;min-width:0;overflow-wrap:anywhere;user-select:all}
.shortcut{display:flex;align-items:center;gap:12px;padding:14px;text-align:left;width:100%}
.shortcut div{flex:1;min-width:0}
.shortcut b{display:block}
.shortcut svg{width:22px;height:22px;color:var(--accent);flex:none}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.viewer{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.viewer img{max-height:80%;max-width:100%;border-radius:8px}
.viewer .row{margin-top:14px}
.viewer .btn{background:#fff;color:#111;border-color:#fff}
@media (max-width:380px){.grid3{grid-template-columns:1fr 1fr}.grid3 .f-usia{grid-column:span 1}.summary{grid-template-columns:1fr;justify-items:center}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .5s ease}.entry,.tile{transition:transform .12s}.entry:active,.tile:active{transform:scale(.985)}}
</style>

/* ===================== Penyimpanan lokal (IndexedDB) ===================== */
const mem = {recs:new Map(), files:new Map(), kv:new Map(), acts:new Map()};
let idb = null;
function openDB(){ return new Promise(res=>{
  try{ const rq = indexedDB.open('logbook-kakv',2);
    rq.onupgradeneeded = ()=>{ const d=rq.result; const has=n=>d.objectStoreNames.contains(n);
      if(!has('recs')) d.createObjectStore('recs',{keyPath:'id'}); if(!has('files')) d.createObjectStore('files'); if(!has('kv')) d.createObjectStore('kv');
      if(!has('acts')) d.createObjectStore('acts',{keyPath:'id'}); };
    rq.onsuccess = ()=>{ idb=rq.result; res(); }; rq.onerror = ()=>res();
  }catch(e){ res(); } }); }
function tx(store,mode,fn){ return new Promise((res,rej)=>{
  if(!idb){ res(fn(null)); return; }
  try{ const t=idb.transaction(store,mode); const s=t.objectStore(store); const r=fn(s);
    t.oncomplete=()=>res(r instanceof IDBRequest ? r.result : r); t.onerror=()=>rej(t.error);
  }catch(e){ rej(e); } }); }
const store = {
  async all(){ if(!idb) return [...mem.recs.values()]; return tx('recs','readonly',s=>s.getAll()); },
  async put(r){ if(!idb){mem.recs.set(r.id,r);return;} await tx('recs','readwrite',s=>s.put(r)); },
  async allActs(){ if(!idb) return [...mem.acts.values()]; return tx('acts','readonly',s=>s.getAll()); },
  async putAct(a){ if(!idb){mem.acts.set(a.id,a);return;} await tx('acts','readwrite',s=>s.put(a)); },
  async delAct(id){ if(!idb){mem.acts.delete(id);return;} await tx('acts','readwrite',s=>s.delete(id)); },
  async del(id){ if(!idb){mem.recs.delete(id);return;} await tx('recs','readwrite',s=>s.delete(id)); },
  async putFile(id,blob){ if(!idb){mem.files.set(id,blob);return;} await tx('files','readwrite',s=>s.put(blob,id)); },
  async getFile(id){ if(!idb) return mem.files.get(id); return tx('files','readonly',s=>s.get(id)); },
  async delFile(id){ if(!idb){mem.files.delete(id);return;} await tx('files','readwrite',s=>s.delete(id)); },
  async get(k){ if(!idb) return mem.kv.get(k); return tx('kv','readonly',s=>s.get(k)); },
  async set(k,v){ if(!idb){mem.kv.set(k,v);return;} await tx('kv','readwrite',s=>s.put(v,k)); },
};

    if(hit) o.dpjp=hit; else if(!SURGEON_RX.test(o.dpjpRaw) && /an(estesi)?|icu|konsulen/i.test(o._dpjpLbl||'')) o.dpjp=o.dpjpRaw; }
  delete o.dpjpRaw; delete o._dpjpLbl;
  const allTx=[o.diagnosis,o.tindakanOp,o.tindakanAn,o.ket].join(' ');
  const dxop=[o.diagnosis,o.tindakanOp].join(' ').trim();
  o.kat=(guessKat(allTx)==='ICU'?'ICU':'')||guessKat(o.tindakanOp)||guessKat(o.diagnosis)||(dxop?'':guessKat([o.tindakanAn,o.ket].join(' ')));
  o._valid = !!(o.nrm || o.usia || labeled>=2 || HON_RX.test(o.nama||''));
  return o;
}
function parseWhatsApp(raw){
  const {lines,headDate}=cleanWaText(raw);
  const starts=lines.map((l,i)=>isPatientStart(l)?i:-1).filter(i=>i>=0);
  const first=starts.length?starts[0]:0;
  let topDate='';
  for(const l of lines.slice(0,first)){ const d=findDate(l); if(d){ topDate=d; break; } }
  if(!topDate) topDate=headDate;
  let blocks=[];
  if(starts.length){ starts.forEach((s,k)=>blocks.push(lines.slice(s,k+1<starts.length?starts[k+1]:lines.length))); }
  else blocks=[lines];
  return blocks.map(b=>parseBlock(b,topDate)).filter(o=>o._valid&&(o.nama||o.nrm||o.diagnosis)).map(o=>{ delete o._valid; return o; });
}

function fillDraftFromWa(o,idx){
  const keep=draft&&!draft.nama&&!draft.nrm?draft:newDraft();
  const auto=[];
  for(const f of ['tanggal','nama','nrm','usia','diagnosis','tindakanOp','tindakanAn','ket']) if(o[f]){ keep[f]=o[f]; auto.push(f); }
  if(o.usiaU) keep.usiaU=o.usiaU; if(o.jk) keep.jk=o.jk; if(o.kat){ keep.kat=o.kat; keep._katUnknown=false; } else keep._katUnknown=true;
  if(o.skills&&o.skills.length){ keep.skills=[...new Set([...(keep.skills||[]),...o.skills])]; auto.push('skills'); }
  if(o.dpjp){ keep.dpjp=o.dpjp; if(!PEMBIMBING.includes(o.dpjp)) keep._dpjpLain=true; }
  if(!keep.tanggal) keep.tanggal=todayISO();
  keep._auto=auto; keep._for=null; if(idx!=null) keep._waIdx=idx;
  draft=keep;
}

function parseDate(v){
  if(v instanceof Date && !isNaN(v)){ const d=new Date(v.getTime()-v.getTimezoneOffset()*60000); return d.toISOString().slice(0,10); }
  if(typeof v==='number'){ const d=XLSX.SSF.parse_date_code(v); if(d) return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`; }
  const s=String(v||'').trim().toLowerCase(); let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/))){ const y=m[3].length===2?'20'+m[3]:m[3]; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  if((m=s.match(/^(\d{1,2})\s+([a-z]+)\s+(\d{4})$/))){ let i=BULAN.findIndex(b=>b.startsWith(m[2].slice(0,3))); if(i<0) i=BULAN_EN.findIndex(b=>b.startsWith(m[2].slice(0,3))); if(i>=0) return `${m[3]}-${String(i+1).padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  return '';
}
async function importXlsx(file){
  if(!file) return; if(typeof XLSX==='undefined'){ toast('Pustaka Excel belum termuat'); return; }
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{cellDates:true});
    let added=0, skipped=0;
    for(const name of wb.SheetNames){
      const nm=name.trim().toLowerCase(); const K=KAT.find(x=>[x.k,x.sheet,x.label].some(v=>v.toLowerCase()===nm)); if(!K) continue;
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:''});
      for(const row of rows.slice(2)){
        const nama=String(row[2]||'').trim(); if(!nama) continue;
        const tgl=parseDate(row[1]); const nrm=String(row[3]||'').trim();
        if(RECS.some(r=>r.kat===K.k&&r.nrm===nrm&&r.tanggal===tgl)){ skipped++; continue; }
        const rec={id:uid(),kat:K.k,tanggal:tgl,nama,nrm,jk:String(row[4]||'').trim().toUpperCase().slice(0,1),usia:String(row[5]||'').trim(),usiaU:'th',diagnosis:String(row[6]||'').trim(),tindakanOp:String(row[7]||'').trim(),tindakanAn:String(row[8]||'').trim(),dpjp:String(row[9]||'').trim(),ket:String(row[10]||'').trim(),level:'',skills:[],refleksi:'',verif:false,files:[],created:Date.now()+added,contoh:false};
        await store.put(rec); RECS.push(rec); added++;
      }
    }
    toast(`${added} kasus diimpor${skipped?`, ${skipped} duplikat dilewati`:''}`); render();
  }catch(e){ toast('File tidak bisa dibaca. Pastikan formatnya .xlsx logbook KAKV.'); }
  $('#inX').value='';
}
async function exportJson(){
  const toB64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b);});
  const files={}; for(const r of [...RECS,...ACTS]) for(const f of r.files||[]){ const b=await store.getFile(f.id); if(b) files[f.id]=await toB64(b); }
  const data=JSON.stringify({app:'logbook-kakv',v:2,profile:PROFILE,recs:RECS.filter(r=>!r.contoh),acts:ACTS.filter(a=>!a.contoh),files});
  saveFile(`cadangan-logbook-kakv-${todayISO()}.json`,data);
}
async function importJson(file){
  if(!file) return;
  try{ const d=JSON.parse(await file.text()); if(d.app!=='logbook-kakv') throw 0;
    let n=0; for(const r of d.recs||[]){ if(RECS.some(x=>x.id===r.id)) continue;
      for(const f of r.files||[]){ const u=d.files[f.id]; if(u){ const b=await (await fetch(u)).blob(); await store.putFile(f.id,b); } }
      await store.put(r); RECS.push(r); n++; }
    for(const a of d.acts||[]){ if(ACTS.some(x=>x.id===a.id)) continue;
      for(const f of a.files||[]){ const u=d.files[f.id]; if(u){ const b=await (await fetch(u)).blob(); await store.putFile(f.id,b); } }
      await store.putAct(a); ACTS.push(a); n++; }
    if(d.profile && !PROFILE.nama){ PROFILE={...PROFILE,...d.profile}; await store.set('profile',PROFILE); }
    toast(`${n} entri dipulihkan`); render();
  }catch(e){ toast('File cadangan tidak valid'); }
  $('#inJ').value='';
}

function authMsg(e){
  const c=(e&&e.code)||'';
  if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request') return 'Login dibatalkan. Tekan tombol di atas untuk mencoba lagi.';
  if(c==='auth/network-request-failed') return 'Tidak ada koneksi internet. Sambungkan lalu coba lagi.';
  if(c==='auth/unauthorized-domain') return 'Alamat aplikasi ini belum didaftarkan di Firebase (Authentication → Settings → Authorized domains).';
  if(c==='auth/operation-not-allowed') return 'Login Google belum diaktifkan di Firebase (Authentication → Sign-in method → Google).';
  if(c==='auth/user-disabled') return 'Akun ini dinonaktifkan oleh admin.';
  return (e&&e.message&&!c)?e.message:'Login gagal ('+(c||'tidak diketahui')+'). Coba lagi.';
}

function showLogin(done){
  const L=$('#login'); L.hidden=false;
  const st={busy:true,err:''};
  const draw=()=>{
    L.innerHTML=loginHead()+`<div class="lcard">
      <div><h2 style="font-size:18px">Masuk</h2><span class="small muted">Gunakan akun Google (Gmail) Anda. Cukup sekali di perangkat ini.</span></div>
      <button class="gbtn" id="gIn" ${st.busy?'disabled':''}>${G_ICON}<span>${st.busy?'Menyiapkan…':'Masuk dengan Google'}</span></button>

    const b=$('#gIn'); if(b) b.onclick=signIn;
  };
  async function afterUser(u){
    if(!u) return false;
    let saved=null; try{ saved=await store.get('acct:'+u.uid); }catch(e){}
    const base={uid:u.uid,email:u.email||'',photo:u.photoURL||'',gname:u.displayName||''};

    showProfileForm({...base,nama:u.displayName||'',npm:'',angkatan:''},finish);
    return true;
  }
  async function finish(sess){
    SESSION={...sess,at:Date.now()};

    done(true);
  }

    st.busy=true; st.err=''; draw();

      const auth=await loadFirebase();
      const prov=new firebase.auth.GoogleAuthProvider(); prov.setCustomParameters({prompt:'select_account'});
      let res;
      try{ res=await auth.signInWithPopup(prov); }

        if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')){ await auth.signInWithRedirect(prov); return; }

      }

  })();

async function addActFiles(list,kind){
  for(const file of list){ const blob=await compress(file); const id=uid();
    let name=file.name; if(blob!==file && !/\.jpe?g$/i.test(name)) name=name.replace(/\.[^.]+$/,'')+'.jpg';
    actDraft._new.push({id,blob}); actDraft.files.push({id,name,type:blob.type||file.type,size:blob.size,kind}); }
  renderActFiles();
}
async function renderActFiles(){
  const foto=actDraft.files.filter(f=>f.kind==='foto'), sert=actDraft.files.filter(f=>f.kind==='sertifikat');
  $('#aFoto').innerHTML=foto.map(f=>`<div class="thumb"><img data-fid="${f.id}" alt="${esc(f.name)}"><button type="button" class="x" data-rm="${f.id}" aria-label="Hapus foto">✕</button></div>`).join('');
  $('#aSert').innerHTML=sert.map(f=>`<div class="file">${ICON.doc}<span class="nm">${esc(f.name)}</span><span class="small muted mono">${kb(f.size)}</span><button type="button" class="btn ghost" data-rm="${f.id}" aria-label="Hapus">✕</button></div>`).join('');
  $('#v-actform').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ const id=b.dataset.rm; actDraft.files=actDraft.files.filter(x=>x.id!==id);
    if(actDraft._new.find(n=>n.id===id)) actDraft._new=actDraft._new.filter(n=>n.id!==id); else actDraft._removed.push(id); renderActFiles(); });
  for(const img of $('#aFoto').querySelectorAll('img')) img.src=await blobURL(img.dataset.fid);
}
async function saveActDraft(){
  const a=actDraft; const miss=[];
  if(!a.judul) miss.push('judul'); if(!a.semester) miss.push('semester'); if(!a.tanggal) miss.push('tanggal'); if(!a.jamMulai) miss.push('jam mulai'); if(!a.media) miss.push('media'); if(!a.pembimbing) miss.push('pembimbing');
  const er=$('#aerr');
  if(miss.length){ er.hidden=false; er.textContent='Lengkapi '+miss.join(', ')+' sebelum menyimpan.'; er.scrollIntoView({block:'center'}); return; }
  if(a.jamSelesai && a.jamSelesai<=a.jamMulai){ er.hidden=false; er.textContent='Jam selesai harus setelah jam mulai.'; er.scrollIntoView({block:'center'}); return; }
  for(const n of a._new) await store.putFile(n.id,n.blob);
  for(const id of a._removed) await store.delFile(id);
  const rec={...a}; delete rec._new; delete rec._removed; delete rec._for; delete rec._pembLain; delete rec.skp; rec.contoh=false; rec.updated=Date.now();
  await store.putAct(rec);
  const i=ACTS.findIndex(x=>x.id===rec.id); i<0?ACTS.push(rec):ACTS[i]=rec;
  const wasEdit=!!ui.actEditing; actDraft=null;
  toast(wasEdit?'Perubahan disimpan':'Kegiatan disimpan');
  go('actdetail',{actDetail:rec.id,actEditing:null,confirmDel:false});
}

(async()=>{
  await openDB();
  if(!(await ensureLogin())) return;
  try{ RECS = await store.all() || []; }catch(e){ RECS=[]; }

  if(SESSION){ PROFILE.nama=SESSION.nama; PROFILE.npm=SESSION.npm; if(SESSION.angkatan) PROFILE.angkatan=SESSION.angkatan; try{ await store.set('profile',PROFILE); }catch(e){} }

  if(!RECS.length && !seeded){ for(const r of seed()){ await store.put(r); RECS.push(r);} try{await store.set('seeded',true);}catch(e){} }

  if(!ACTS.length && !seededA){ for(const a of seedActs()){ await store.putAct(a); ACTS.push(a);} try{await store.set('seededActs',true);}catch(e){} }

})();
